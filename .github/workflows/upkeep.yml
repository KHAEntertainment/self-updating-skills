name: upkeep

# The CI runner of the Skill Engine (architecture D9, decision P3).
#
# It updates the skills this repo owns ("owner": "ci" in the sidecar),
# opens one pull request per changed skill and lets auto-merge squash it
# once the required checks pass.

on:
  schedule:
    # Daily at 06:17 UTC. Off the hour and off the half hour: every
    # scheduled workflow that shares :00 lands in the same queue, and
    # GitHub delays the busiest slots.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Overlapping runs are serialised, not cancelled: a cancelled run would
# leave the state database half written. The engine's own lease is the
# second line of defence — a run that finds the lease held prints
# "skipped: lease held" and exits 0.
concurrency:
  group: upkeep-ci
  cancel-in-progress: false

jobs:
  update:
    name: Update the ci-owned skills
    runs-on: ubuntu-latest
    env:
      # The key comes from the repository secret; it is never written to a
      # file, a log line or a report.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the engine
        run: go build -o "$RUNNER_TEMP/upkeep" ./cmd/upkeep

      - name: Restore the state database
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/upkeep/state.db
          key: upkeep-state-v1-${{ github.run_id }}
          restore-keys: upkeep-state-v1-

      - name: Update the ci-owned skills
        id: update
        env:
          # The state database lives outside the repo and is carried
          # between runs by the cache below (spec:
          # $RUNNER_TEMP/upkeep/state.db). The engine derives the same
          # path from RUNNER_TEMP on its own; naming it here keeps the
          # cache path and the engine's path in one place.
          UPKEEP_STATE_DB: ${{ runner.temp }}/upkeep/state.db
        run: |
          mkdir -p "$RUNNER_TEMP/upkeep"
          set +e
          "$RUNNER_TEMP/upkeep" update --runner ci --json skills/* > "$RUNNER_TEMP/upkeep/update.json"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e
          cat "$RUNNER_TEMP/upkeep/update.json"

      - name: Publish the run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/ci-publish.sh \
            --update-json "$RUNNER_TEMP/upkeep/update.json" \
            --repo "$GITHUB_WORKSPACE" \
            --base main

      - name: Summarise the run
        if: always()
        run: |
          python3 - "$RUNNER_TEMP/upkeep/update.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys

          try:
              with open(sys.argv[1]) as f:
                  data = json.load(f)
          except Exception as exc:  # noqa: BLE001
              print("## upkeep\n\nThe run report could not be read: %s" % exc)
              raise SystemExit(0)

          print("## upkeep\n")
          print("Run %s, outcome **%s**.\n" % (data.get("run_id"), data.get("run_outcome")))
          print("| skill | status | reason |")
          print("| --- | --- | --- |")
          for skill in data.get("skills") or []:
              name = (skill.get("skill_dir") or "").rstrip("/").split("/")[-1]
              reason = " ".join((skill.get("reason") or "").split()).replace("|", "\\|")
              print("| %s | %s | %s |" % (name, skill.get("status"), reason))
          rows = []
          for skill in data.get("skills") or []:
              name = (skill.get("skill_dir") or "").rstrip("/").split("/")[-1]
              for row in skill.get("rows") or []:
                  draft = row.get("row") or {}
                  checks = ", ".join(
                      "%s %s" % (c.get("name"), "pass" if c.get("pass") else ("fail" if c.get("ran") else "not run"))
                      for c in (row.get("checks") or [])
                  )
                  rows.append("| %s | `%s` | `%s` | %s | %s |" % (
                      name, draft.get("old"), draft.get("new"), checks, row.get("outcome")))
          if rows:
              print("\n### Rows\n")
              print("| skill | old | new | checks | outcome |")
              print("| --- | --- | --- | --- | --- |")
              for line in rows:
                  print(line)
          PY

      - name: Save the state database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/upkeep/state.db
          key: upkeep-state-v1-${{ github.run_id }}
