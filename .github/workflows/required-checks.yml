name: required-checks

# The gate every pull request to main has to pass (architecture D9).
#
#   * "upkeep check --strict" on the skills.
#   * "upkeep render --check": a hand edit inside a generated region
#     fails the job.
#   * The test suite, including the conformance matrix that pins the Go
#     engine's verdicts to the frozen shell script's.

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify the skills
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          # The gate compares against the merge base, so the fetch-depth
          # has to cover it.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the engine
        run: go build -o "$RUNNER_TEMP/upkeep" ./cmd/upkeep

      - name: Tests (including the conformance matrix)
        run: go test -count=1 ./...

      - name: upkeep check and upkeep render --check
        run: bash scripts/required-checks.sh "$RUNNER_TEMP/upkeep" origin/main
