name: Required checks

# The gate every pull request to main has to pass (architecture D9).
#
#   * "upkeep check --strict" on the skills.
#   * "upkeep render --check": a hand edit inside a generated region
#     fails the job.
#   * The test suite, including the conformance matrix that pins the Go
#     engine's verdicts to the frozen shell script's.
#
# One job, id and name "required-checks": that is the status context the
# branch protection on main requires.

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  required-checks:
    name: required-checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          # The gate compares against the merge base, so the fetch-depth
          # has to cover it.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the engine
        run: go build -o "$RUNNER_TEMP/upkeep" ./cmd/upkeep

      - name: Tests (including the conformance matrix)
        run: go test -count=1 ./...

      - name: upkeep check --strict and upkeep render --check
        env:
          # Set to "1" to gate the job on every skill, not only on the
          # skills the pull request touches. Turn it on once the skills
          # without a sidecar are retrofitted with an owner: three of
          # this repo's skills have no sidecar, so no runner owns them
          # and their pins drift on their own — gating on all of them
          # would keep the job red and block every merge, including the
          # updater's own pull requests.
          UPKEEP_REQUIRE_ALL_SKILLS: ""
        run: bash scripts/required-checks.sh "$RUNNER_TEMP/upkeep" origin/main
